name: Verify final core kubeconfig documentation
'on':
  push:
    branches:
    - verify/core-kubeconfig
  workflow_dispatch: {}
permissions:
  contents: read
env:
  GOLANG_VERSION: 1.27.3
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}
jobs:
  codegen:
    name: Check changes to generated code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
    - name: Create symlink in GOPATH
      run: 'mkdir -p ~/go/src/github.com/argoproj

        cp -a ../${GITHUB_EVENT_REPOSITORY_NAME} ~/go/src/github.com/argoproj

        '
      env:
        GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
    - name: Add ~/go/bin to PATH
      run: 'echo "/home/runner/go/bin" >> $GITHUB_PATH

        '
    - name: Add /usr/local/bin to PATH
      run: 'echo "/usr/local/bin" >> $GITHUB_PATH

        '
    - name: Download & vendor dependencies
      run: '# We need to vendor go modules for codegen yet

        go mod download

        go mod vendor -v

        '
      working-directory: /home/runner/go/src/github.com/argoproj/${{ github.event.repository.name }}
    - name: Install toolchain for codegen
      run: 'make install-codegen-tools-local

        make install-go-tools-local

        '
      working-directory: /home/runner/go/src/github.com/argoproj/${{ github.event.repository.name }}
    - name: Add dist to PATH
      run: 'echo "/home/runner/work/argo-cd/argo-cd/dist" >> $GITHUB_PATH

        '
    - name: Run codegen
      run: 'set -x

        GOPATH=$(go env GOPATH)

        export GOPATH

        git checkout -- go.mod go.sum

        make codegen-local

        '
      working-directory: /home/runner/go/src/github.com/argoproj/${{ github.event.repository.name }}
    - name: Require clean generated documentation and code
      working-directory: /home/runner/go/src/github.com/argoproj/argo-cd
      run: 'git diff --exit-code -- . '':!go.sum'' '':!go.mod'' '':!assets/swagger.json''

        '
    timeout-minutes: 90
  documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python -m pip install -r docs/requirements.txt
    - run: make build-docs-local
