name: Verify core kubeconfig reviewer changes
'on':
  push:
    branches:
    - verify/core-kubeconfig
  workflow_dispatch: {}
permissions:
  contents: read
env:
  GOLANG_VERSION: 1.27.3
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}
jobs:
  build-go:
    name: Build & cache Go code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache: false
    - name: Restore go build and module cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cache/go-build

          ~/go/pkg/mod

          '
        key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-build-v1-

          '
    - name: Download Go modules
      run: 'go mod download

        '
    - name: Compile all packages
      run: make build-local
    - name: Build the CLI
      run: make cli-local
    timeout-minutes: 90
  lint-go:
    permissions:
      contents: read
      pull-requests: read
    name: Lint Go code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        version: v2.15.0
        args: --verbose
    timeout-minutes: 90
  build-ui:
    name: Build, test & lint UI code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        package_json_file: ui/package.json
    - name: Setup NodeJS
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        cache: pnpm
        cache-dependency-path: '**/pnpm-lock.yaml'
    - name: Install node dependencies
      run: 'cd ui && pnpm i --frozen-lockfile

        '
    - name: Build UI code
      run: 'NODE_ENV=''test'' pnpm test

        pnpm build

        '
      env:
        NODE_ENV: production
        NODE_ONLINE_ENV: online
        CODECOV_TOKEN: ${{ github.ref == 'refs/heads/master' && secrets.CODECOV_TOKEN || '' }}
      working-directory: ui/
    - name: Run ESLint
      run: pnpm lint
      working-directory: ui/
    timeout-minutes: 90
  test-go:
    name: Run unit tests for Go packages
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.E2E_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.E2E_TEST_GITLAB_TOKEN }}
      ARGOCD_TEST_PARALLEL: '2'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Create checkout directory
      run: mkdir -p ~/go/src/github.com/argoproj
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Create symlink in GOPATH
      run: ln -s "$(pwd)" ~/go/src/github.com/argoproj/argo-cd
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache: false
    - name: Install required packages
      run: 'sudo apt-get install git -y

        '
    - name: Switch to temporal branch so we re-attach head
      run: 'git switch -c temporal-pr-branch

        git status

        '
    - name: Fetch complete history for blame information
      run: 'git fetch --prune --no-tags --depth=1 origin +refs/heads/*:refs/remotes/origin/*

        '
    - name: Add ~/go/bin to PATH
      run: 'echo "/home/runner/go/bin" >> $GITHUB_PATH

        '
    - name: Add /usr/local/bin to PATH
      run: 'echo "/usr/local/bin" >> $GITHUB_PATH

        '
    - name: Restore go build and module cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cache/go-build

          ~/go/pkg/mod

          '
        key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-build-v1-

          '
    - name: Install all tools required for building & testing
      run: 'make install-test-tools-local

        '
    - name: Add dist to PATH
      run: 'echo "/home/runner/work/argo-cd/argo-cd/dist" >> $GITHUB_PATH

        '
    - name: Setup git username and email
      run: 'git config --global user.name "John Doe"

        git config --global user.email "john.doe@example.com"

        '
    - name: Download Go modules
      run: 'go mod download

        '
    - name: Run all unit tests
      run: make test-local
    - name: Generate test results artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: test-results
        path: test-results
    needs:
    - build-go
    timeout-minutes: 90
  codegen:
    name: Check changes to generated code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
    - name: Create symlink in GOPATH
      run: 'mkdir -p ~/go/src/github.com/argoproj

        cp -a ../${GITHUB_EVENT_REPOSITORY_NAME} ~/go/src/github.com/argoproj

        '
      env:
        GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
    - name: Add ~/go/bin to PATH
      run: 'echo "/home/runner/go/bin" >> $GITHUB_PATH

        '
    - name: Add /usr/local/bin to PATH
      run: 'echo "/usr/local/bin" >> $GITHUB_PATH

        '
    - name: Download & vendor dependencies
      run: '# We need to vendor go modules for codegen yet

        go mod download

        go mod vendor -v

        '
      working-directory: /home/runner/go/src/github.com/argoproj/${{ github.event.repository.name }}
    - name: Install toolchain for codegen
      run: 'make install-codegen-tools-local

        make install-go-tools-local

        '
      working-directory: /home/runner/go/src/github.com/argoproj/${{ github.event.repository.name }}
    - name: Add dist to PATH
      run: 'echo "/home/runner/work/argo-cd/argo-cd/dist" >> $GITHUB_PATH

        '
    - name: Run codegen
      run: 'set -x

        GOPATH=$(go env GOPATH)

        export GOPATH

        git checkout -- go.mod go.sum

        make codegen-local

        '
      working-directory: /home/runner/go/src/github.com/argoproj/${{ github.event.repository.name }}
    - name: Check generated changes and save the login documentation patch
      working-directory: /home/runner/go/src/github.com/argoproj/argo-cd
      run: 'git diff --binary -- docs/user-guide/commands > "$GITHUB_WORKSPACE/core-codegen.patch"

        git diff --exit-code -- . '':!go.sum'' '':!go.mod'' '':!assets/swagger.json'' '':!docs/user-guide/commands''

        '
    - name: Upload generated documentation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: core-kubeconfig-codegen
        path: core-codegen.patch
        retention-days: 7
    timeout-minutes: 90
  documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python -m pip install -r docs/requirements.txt
    - run: make build-docs-local
  review-tests:
    name: Reviewer regressions and headless patch coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - &id001
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 8
    - &id002
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache: false
    - &id003
      name: Restore go build and module cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cache/go-build

          ~/go/pkg/mod

          '
        key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-build-v1-

          '
    - name: Reproduce registration flag regression before the fix
      shell: bash
      run: 'set -euo pipefail

        file=cmd/argocd/commands/headless/headless.go

        git checkout d580b3402aa671d83bcef700b10955b1d939d4ac -- "$file"

        set +e

        go test ./cmd/argocd/commands -run ''^TestClusterAddKubeConfigIsolation$'' -count=1 > /tmp/cluster-before.log 2>&1

        result=$?

        set -e

        cat /tmp/cluster-before.log

        git restore --source=HEAD --staged --worktree -- "$file"

        test "$result" -ne 0

        grep ''^--- FAIL: TestClusterAddKubeConfigIsolation'' /tmp/cluster-before.log

        '
    - name: Run login, cluster, dashboard, and initialization regressions
      run: go test ./cmd/argocd/commands ./cmd/argocd/commands/admin ./cmd/argocd/commands/headless ./cmd/argocd/commands/initialize
        -count=1
    - name: Verify changed core code remains fully covered
      run: 'go test ./cmd/argocd/commands/headless -count=1 -covermode=atomic -coverprofile=core-review-coverage.out

        python .github/scripts/core_patch_coverage.py core-review-coverage.out'
    - name: Keep coverage evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: core-review-coverage
        path: core-review-coverage.out
        retention-days: 7
  cli-process:
    name: Real CLI login validation and saved kubeconfig selection
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - *id001
    - *id002
    - *id003
    - name: Build CLI
      run: make cli-local
    - name: Run CLI process regression
      working-directory: test/e2e
      run: go test cli_core_test.go -run '^TestCliCoreKubeConfigPersistence$' -count=1 -timeout 2m -v
