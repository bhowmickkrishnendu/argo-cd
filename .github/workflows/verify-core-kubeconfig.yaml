name: Verify final core CLI process regression
'on':
  push:
    branches:
    - verify/core-kubeconfig
  workflow_dispatch: {}
permissions:
  contents: read
env:
  GOLANG_VERSION: 1.27.3
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}
jobs:
  lint-go:
    permissions:
      contents: read
      pull-requests: read
    name: Lint Go code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        version: v2.15.0
        args: --verbose
    timeout-minutes: 90
  core-cli:
    name: Core CLI process regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache: false
    - name: Restore go build and module cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cache/go-build

          ~/go/pkg/mod

          '
        key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-build-v1-

          '
    - name: Build the CLI
      run: make cli-local
    - name: Check core and affected upstream packages after syncing master
      run: go test ./cmd/argocd/commands ./cmd/argocd/commands/headless ./cmd/argocd/commands/initialize ./cmd/argocd/commands/admin ./util/localconfig ./pkg/apiclient ./util/sourceintegrity -count=1
    - name: Run real CLI processes against selected Kubernetes endpoints
      working-directory: test/e2e
      run: go test cli_core_test.go -run '^TestCliCoreKubeConfigPersistence$' -count=1 -timeout 2m -v
