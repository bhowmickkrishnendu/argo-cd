name: Verify core kubeconfig persistence
'on':
  push:
    branches:
    - verify/core-kubeconfig
  workflow_dispatch: {}
permissions:
  contents: read
env:
  GOLANG_VERSION: 1.27.3
  STEP_SECURITY_HARDEN_RUNNER: ${{ vars.disable_harden_runner }}
jobs:
  build-go:
    name: Build & cache Go code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache: false
    - name: Restore go build and module cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cache/go-build

          ~/go/pkg/mod

          '
        key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-build-v1-

          '
    - name: Download Go modules
      run: 'go mod download

        '
    - name: Compile all packages
      run: make build-local
    - name: Build the CLI
      run: make cli-local
    timeout-minutes: 90
  lint-go:
    permissions:
      contents: read
      pull-requests: read
    name: Lint Go code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        version: v2.15.0
        args: --verbose
    timeout-minutes: 90
  build-ui:
    name: Build, test & lint UI code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        package_json_file: ui/package.json
    - name: Setup NodeJS
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        cache: pnpm
        cache-dependency-path: '**/pnpm-lock.yaml'
    - name: Install node dependencies
      run: 'cd ui && pnpm i --frozen-lockfile

        '
    - name: Build UI code
      run: 'NODE_ENV=''test'' pnpm test

        pnpm build

        '
      env:
        NODE_ENV: production
        NODE_ONLINE_ENV: online
        CODECOV_TOKEN: ${{ github.ref == 'refs/heads/master' && secrets.CODECOV_TOKEN || '' }}
      working-directory: ui/
    - name: Run ESLint
      run: pnpm lint
      working-directory: ui/
    timeout-minutes: 90
  test-go:
    name: Run unit tests for Go packages
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.E2E_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.E2E_TEST_GITLAB_TOKEN }}
      ARGOCD_TEST_PARALLEL: '2'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Create checkout directory
      run: mkdir -p ~/go/src/github.com/argoproj
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Create symlink in GOPATH
      run: ln -s "$(pwd)" ~/go/src/github.com/argoproj/argo-cd
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache: false
    - name: Install required packages
      run: 'sudo apt-get install git -y

        '
    - name: Switch to temporal branch so we re-attach head
      run: 'git switch -c temporal-pr-branch

        git status

        '
    - name: Fetch complete history for blame information
      run: 'git fetch --prune --no-tags --depth=1 origin +refs/heads/*:refs/remotes/origin/*

        '
    - name: Add ~/go/bin to PATH
      run: 'echo "/home/runner/go/bin" >> $GITHUB_PATH

        '
    - name: Add /usr/local/bin to PATH
      run: 'echo "/usr/local/bin" >> $GITHUB_PATH

        '
    - name: Restore go build and module cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cache/go-build

          ~/go/pkg/mod

          '
        key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-build-v1-

          '
    - name: Install all tools required for building & testing
      run: 'make install-test-tools-local

        '
    - name: Add dist to PATH
      run: 'echo "/home/runner/work/argo-cd/argo-cd/dist" >> $GITHUB_PATH

        '
    - name: Setup git username and email
      run: 'git config --global user.name "John Doe"

        git config --global user.email "john.doe@example.com"

        '
    - name: Download Go modules
      run: 'go mod download

        '
    - name: Run all unit tests
      run: make test-local
    - name: Generate test results artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: test-results
        path: test-results
    needs:
    - build-go
    timeout-minutes: 90
  codegen:
    name: Check changes to generated code
    runs-on: ubuntu-24.04
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
    - name: Create symlink in GOPATH
      run: 'mkdir -p ~/go/src/github.com/argoproj

        cp -a ../${GITHUB_EVENT_REPOSITORY_NAME} ~/go/src/github.com/argoproj

        '
      env:
        GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
    - name: Add ~/go/bin to PATH
      run: 'echo "/home/runner/go/bin" >> $GITHUB_PATH

        '
    - name: Add /usr/local/bin to PATH
      run: 'echo "/usr/local/bin" >> $GITHUB_PATH

        '
    - name: Download & vendor dependencies
      run: '# We need to vendor go modules for codegen yet

        go mod download

        go mod vendor -v

        '
      working-directory: /home/runner/go/src/github.com/argoproj/${{ github.event.repository.name }}
    - name: Install toolchain for codegen
      run: 'make install-codegen-tools-local

        make install-go-tools-local

        '
      working-directory: /home/runner/go/src/github.com/argoproj/${{ github.event.repository.name }}
    - name: Add dist to PATH
      run: 'echo "/home/runner/work/argo-cd/argo-cd/dist" >> $GITHUB_PATH

        '
    - name: Run codegen
      run: 'set -x

        GOPATH=$(go env GOPATH)

        export GOPATH

        git checkout -- go.mod go.sum

        make codegen-local

        '
      working-directory: /home/runner/go/src/github.com/argoproj/${{ github.event.repository.name }}
    - name: Check generated changes and save the login documentation patch
      working-directory: /home/runner/go/src/github.com/argoproj/argo-cd
      run: 'git diff --binary -- docs/user-guide/commands > "$GITHUB_WORKSPACE/core-codegen.patch"

        git diff --exit-code -- . '':!go.sum'' '':!go.mod'' '':!assets/swagger.json'' '':!docs/user-guide/commands''

        '
    - name: Upload generated documentation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: core-kubeconfig-codegen
        path: core-codegen.patch
        retention-days: 7
    timeout-minutes: 90
  regression:
    name: Core kubeconfig regression and focused tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 8
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache: false
    - name: Restore go build and module cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cache/go-build

          ~/go/pkg/mod

          '
        key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-build-v1-

          '
    - name: Reproduce the login failure on upstream
      shell: bash
      run: 'set -euo pipefail

        files=(cmd/argocd/commands/login.go cmd/argocd/commands/headless/headless.go cmd/argocd/commands/admin/dashboard.go
        pkg/apiclient/apiclient.go util/localconfig/localconfig.go)

        git checkout 5b22083a923f08b48bfb0651f937d9019dab0b9b -- "${files[@]}"

        set +e

        go test ./cmd/argocd/commands -run ''^TestLoginCoreKubeConfigPath$'' -count=1 -v > /tmp/core-before.log 2>&1

        result=$?

        set -e

        cat /tmp/core-before.log

        git restore --source=HEAD --staged --worktree -- "${files[@]}"

        test "$result" -ne 0

        grep -F ''unknown flag: --kubeconfig'' /tmp/core-before.log

        '
    - name: Run focused tests with the feature
      run: go test ./cmd/argocd/commands ./cmd/argocd/commands/headless ./cmd/argocd/commands/initialize ./cmd/argocd/commands/admin
        ./util/localconfig -count=1
  documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: python -m pip install -r docs/requirements.txt
    - run: make build-docs-local
  core-e2e:
    name: Core kubeconfig CLI end-to-end
    runs-on: ubuntu-24.04
    needs:
    - build-go
    env:
      ARGOCD_FAKE_IN_CLUSTER: 'true'
      ARGOCD_E2E_K3S: 'true'
      ARGOCD_IN_CI: 'true'
      ARGOCD_E2E_APISERVER_PORT: '8088'
      ARGOCD_APPLICATION_NAMESPACES: argocd-e2e-external,argocd-e2e-external-2
      ARGOCD_SERVER: 127.0.0.1:8088
      GITHUB_TOKEN: ${{ secrets.E2E_TEST_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.E2E_TEST_GITLAB_TOKEN }}
      TEST_FLAGS: -run ^TestCliCoreKubeConfigPersistence$
      ARGOCD_E2E_RERUN_FAILS: '0'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: ${{ vars.disable_harden_runner != 'true' }}
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
      with:
        large-packages: false
        docker-images: false
        swap-storage: false
        tool-cache: false
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Golang
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ${{ env.GOLANG_VERSION }}
        cache: false
    - name: Set GOPATH
      run: 'echo "GOPATH=$HOME/go" >> $GITHUB_ENV

        '
    - name: Setup NodeJS
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        package_json_file: ui/package.json
    - name: GH actions workaround - Kill XSP4 process
      run: 'sudo pkill mono || true

        '
    - name: Install K3S
      env:
        INSTALL_K3S_VERSION: v1.37.0+k3s1
      run: 'set -x

        curl -sfL https://get.k3s.io | sh -

        sudo chmod -R a+rw /etc/rancher/k3s

        sudo mkdir -p $HOME/.kube && sudo chown -R "$(whoami)" $HOME/.kube

        # shellcheck disable=SC2024

        sudo k3s kubectl config view --raw > $HOME/.kube/config

        sudo chown "$(whoami)" $HOME/.kube/config

        sudo chmod go-r $HOME/.kube/config

        kubectl version

        '
    - name: Restore go build and module cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cache/go-build

          ~/go/pkg/mod

          '
        key: ${{ runner.os }}-go-build-v1-${{ hashFiles('**/go.sum') }}
        restore-keys: '${{ runner.os }}-go-build-v1-

          '
    - name: Add ~/go/bin to PATH
      run: 'echo "$HOME/go/bin" >> $GITHUB_PATH

        '
    - name: Add /usr/local/bin to PATH
      run: 'echo "/usr/local/bin" >> $GITHUB_PATH

        '
    - name: Add ./dist to PATH
      run: 'echo "$(pwd)/dist" >> $GITHUB_PATH

        '
    - name: Download Go modules
      run: 'go mod download

        '
    - name: Install goreman
      run: 'go install github.com/mattn/goreman@v0.3.17

        '
    - name: Install all tools required for building & testing
      run: 'make install-test-tools-local

        '
    - name: Setup git username and email
      run: 'git config --global user.name "John Doe"

        git config --global user.email "john.doe@example.com"

        '
    - name: Pull Docker image required for tests
      run: '# renovate: datasource=github-releases depName=dexidp/dex

        docker pull ghcr.io/dexidp/dex:v2.46.1

        docker pull argoproj/argo-cd-ci-builder:v1.0.0

        # renovate: datasource=docker packageName=docker.io/library/redis

        docker pull redis:8.10.3-alpine

        '
    - name: Create target directory for binaries in the build-process
      run: 'mkdir -p dist

        chown "$(whoami)" dist

        '
    - name: Run E2E server and wait for it being available
      timeout-minutes: 30
      run: "set -x\n# Something is weird in GH runners -- there's a phantom listener for\n# port 8080 which is not visible\
        \ in netstat -tulpen, but still there\n# with a HTTP listener. We have API server listening on port 8088\n# instead.\n\
        make start-e2e-local COVERAGE_ENABLED=true 2>&1 | sed -r \"s/[[:cntrl:]]\\[[0-9]{1,3}m//g\" > /tmp/e2e-server.log\
        \ &\ncount=1\nuntil curl -f http://127.0.0.1:8088/healthz; do\n  sleep 10;\n  if test $count -ge 180; then\n    echo\
        \ \"Timeout\"\n    exit 1\n  fi\n  count=$((count+1))\ndone\n"
    - name: Run E2E testsuite
      id: e2e
      run: "set -x\nmake test-e2e-local\n# gotestsum retries failures (--rerun-fails), so a green job can still hide a\n#\
        \ flake. Flag it so the server logs below are kept for diagnosis.\nif [ -s rerunreport.txt ]; then\n  echo \"reran=true\"\
        \ >> \"$GITHUB_OUTPUT\"\n  echo \"::warning::e2e tests were retried; see the e2e-server log artifact\"\n  cat rerunreport.txt\n\
        fi\ngoreman run stop-all || echo \"goreman trouble\"\nsleep 30\n"
    - name: Keep end-to-end evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: core-kubeconfig-e2e
        path: '/tmp/e2e-server.log

          test-results/junit.xml

          rerunreport.txt'
        retention-days: 7
    - name: Stop local services
      if: always()
      run: goreman run stop-all || true
    timeout-minutes: 90
